name: Release

# Every merge to main is a release candidate:
#
#   1. ci        — the full CI workflow (ci.yml) runs on the merged code.
#   2. prepare   — scripts/next-version.mjs reads the Conventional Commits since the
#                  last release tag and decides the next version (feat → minor,
#                  fix/perf → patch, `!`/BREAKING CHANGE → major). A merge of only
#                  docs/test/chore/refactor commits stops here: tested, not released.
#                  Otherwise it opens a *draft* GitHub Release with generated notes.
#   3. package   — each OS builds its installers under that version and uploads them,
#                  together with electron-builder's latest*.yml update manifests
#                  (what electron-updater reads), into the draft.
#   4. publish   — only once every platform uploaded: the draft is published, which
#                  creates the git tag. A failure anywhere leaves at most a draft and
#                  no tag, so the next run simply computes the same version again.
#
# Run it by hand (Actions → Release → Run workflow) for a dry run: the same checks and
# packaging, with the installers attached to the run as artifacts instead of released.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Two merges in quick succession must not race for the same version number.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  prepare:
    name: Decide version
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release: ${{ steps.version.outputs.release }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout (full history and tags)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Next version from the commits since the last release
        id: version
        run: node scripts/next-version.mjs --notes release-notes.md

      - name: Open a draft release
        if: steps.version.outputs.release == 'true' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # A draft left behind by a failed earlier run of the same version is reused.
          if gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null | grep -q true; then
            gh release edit "$TAG" --target "$GITHUB_SHA" --notes-file release-notes.md
          else
            gh release create "$TAG" --draft --target "$GITHUB_SHA" \
              --title "Remoty $VERSION" --notes-file release-notes.md
          fi

  package:
    name: Package · ${{ matrix.os }}
    needs: prepare
    if: needs.prepare.outputs.release == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      # Unsigned builds: don't let electron-builder go looking for a signing identity.
      CSC_IDENTITY_AUTO_DISCOVERY: false

    # Bash on every OS, Windows included: PowerShell splits an argument like
    # `-c.win.signAndEditExecutable=true` at the dot, and electron-builder then reads
    # `.win.…` as the path of a config file.
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The .rpm target shells out to rpmbuild, which Ubuntu runners don't ship.
      - name: Install rpm tooling
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm

      # electron-builder names the installers, the update manifests and the release
      # it uploads into after this version, and the app reports it as its own.
      - name: Stamp the release version
        run: npm version "${{ needs.prepare.outputs.version }}" --no-git-tag-version --allow-same-version --workspace packages/electron

      - run: npm run build

      # signAndEditExecutable: stamps the app icon and version info into the Windows .exe
      # (off in electron-builder.yml for local builds, see there). Ignored on other OSes.
      - name: Package and upload to the draft release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --publish always -c.win.signAndEditExecutable=true

      - name: Package (dry run)
        if: github.event_name == 'workflow_dispatch'
        run: npx electron-builder --publish never -c.win.signAndEditExecutable=true

      - name: Keep the dry-run installers
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installers-${{ matrix.os }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.deb
            release/*.rpm
            release/*.yml
          retention-days: 7

  publish:
    name: Publish release
    needs: [prepare, package]
    if: needs.prepare.outputs.release == 'true' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish the draft (creates the tag)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: gh release edit "$TAG" --draft=false --latest
