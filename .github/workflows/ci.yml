name: CI

# Every check the project has, in one place. Runs on pull requests, and is called
# by the Release workflow (release.yml) before anything is published — so a merge
# to main is only ever released after exactly these jobs pass on the merged code.
on:
  pull_request:
    branches: [main]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hygiene:
    name: Repo hygiene + release scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Guard the tracked tree (no docs, keys, or .env)
        run: bash scripts/hygiene-guard.sh

      - name: Exercise the guard on fixtures
        run: bash scripts/hygiene-guard.test.sh

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Test the release version calculation
        run: node --test "scripts/*.test.mjs"

  build-and-test:
    name: Check, unit tests, build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check + svelte-check
        run: npm run check

      - name: Unit tests
        run: npm test

      - name: Build (renderer + main process)
        run: npm run build

  e2e:
    name: End-to-end tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
        working-directory: packages/ui

      - name: End-to-end tests
        run: npm run test:e2e

  integration:
    name: Integration tests (real SSH server)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start the SSH test container
        run: |
          docker compose up -d --build
          # sshd answers once it has read its config; give it a moment.
          for _ in $(seq 1 30); do
            if (exec 3<>/dev/tcp/127.0.0.1/2222) 2>/dev/null; then exit 0; fi
            sleep 1
          done
          echo "SSH test container did not come up" >&2
          docker compose logs
          exit 1

      - name: Integration tests
        run: npm run test:integration

      - name: Stop the SSH test container
        if: always()
        run: docker compose down

  # electron-builder needs each OS's own native tooling (NSIS, AppImage/rpm/deb
  # packagers, the macOS dmg tools), so this proves packaging works on all three
  # before anything reaches a release. `--dir` only: no installers, no publish.
  package-smoke-test:
    name: Package (--dir, ${{ matrix.os }})
    needs: build-and-test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: false

    # Bash on every OS, Windows included: PowerShell splits an argument like
    # `-c.win.signAndEditExecutable=true` at the dot, and electron-builder then reads
    # `.win.…` as the path of a config file.
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # With the .exe editing the release build does (app icon + version info), so a
      # break in it shows up here rather than on release day.
      - name: Package (unpacked directory only)
        run: npm run package:dir -- -c.win.signAndEditExecutable=true
